import net.neoforged.moddevgradle.tasks.JarJar

plugins {
    id 'composemc.jvm-library'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'net.neoforged.moddev.legacyforge'
}

// This adapter owns its loader/toolchain, runtime, local sources and native run options.
kotlin.jvmToolchain(java_version as int)
ext.skiko_version = libs.versions.skiko.standard.get()
apply plugin: 'composemc.skiko-profile'
def runtimeBundle = project(':runtime-standard')

repositories {
    maven { url = 'https://repo.polyfrost.org/releases' }
    mavenCentral()
    google()
}
// Minecraft supplies epoll only on Linux; keep the lock portable across hosts.
dependencyLocking.ignoredDependencies.add('io.netty:netty-transport-native-epoll')

apply from: rootProject.file('gradle/minecraft/sources.gradle')
apply from: rootProject.file('gradle/minecraft/artifacts.gradle')
apply from: rootProject.file('gradle/minecraft/artifact-checks.gradle')
apply from: rootProject.file('gradle/minecraft/runs.gradle')

def rendererFixtures = configureMinecraftSources()
// Reobfuscating the development archive (Forge only) needs its source set's apiElements/runtimeElements, which a feature provides.
java.registerFeature('development') { usingSourceSet sourceSets.development }
legacyForge { version = "$minecraft_version-$forge_version" }
def artifacts = configureMinecraftArtifacts(
    playerJarJar: JarJar.registerWithConfiguration(project, 'playerJarJar'),
    playerWithKotlinJarJar: JarJar.registerWithConfiguration(project, 'playerWithKotlinJarJar'),
    loader: 'forge', runtime: runtimeBundle, rendererFixtures: rendererFixtures,
    metadataPath: 'META-INF/mods.toml',
    metadataValues: [forge_version: forge_version],
    release: tasks.named('reobfJar'),
    remapArchive: { archive, sources -> obfuscation.reobfuscate(archive, sources) })

def requestedBackend = providers.gradleProperty('composemcBackend').orElse('auto').get()
if (!(requestedBackend in ['auto', 'cpu'] + minecraft_backends.split(',').toList()))
    throw new GradleException('Unsupported backend for forge 1.20.1: ' + requestedBackend)
def backend = requestedBackend == 'auto' ? 'opengl' : requestedBackend
def runSettings = minecraftRunSettings(backend)

legacyForge {
    addModdingDependenciesTo sourceSets.packagedRun
    addModdingDependenciesTo sourceSets.test
    addModdingDependenciesTo sourceSets.development
    ideSyncTask artifacts.metadata
    runs {
        configureEach { systemProperty 'composemc.backend', backend }
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        acceptance { client(); configureSuiteRun(delegate, runSettings, 'acceptance') }
        benchmark { client(); configureSuiteRun(delegate, runSettings, 'benchmark') }
    }
    mods {
        composemc {
            sourceSet sourceSets.main
            // The Compose MC modules of the mod JAR; the runtime bundles stay separate libraries.
            artifacts.libraryModules.each { sourceSet it.sourceSets.main }
        }
        composemc_development {
            sourceSet sourceSets.development
            sourceSet project(':demo').sourceSets.main
            rendererFixtures.each { sourceSet it }
        }
    }
}

dependencies {
    compileOnly project(':host')
    compileOnly project(':ui-ore')
    compileOnly project(':render-gl')
    compileOnly project(':menu-sync')
    compileOnly project(':slot-core')
    compileOnly("org.jetbrains.compose.foundation:foundation:" + libs.versions.compose.get())
    developmentCompileOnly project(':demo')
    developmentCompileOnly project(':testing')
    developmentCompileOnly(testFixtures(project(':render-gl')))
    testImplementation project(':host')
    testImplementation project(':menu-sync')
    // Development launches load both bundles as FML libraries, as the with-kotlin player JAR does.
    runtimeOnly(runtimeBundle) {
        capabilities { requireCapability('dev.composemc:composemc-runtime-standard') }
    }
    runtimeOnly(project(':runtime-kotlin')) {
        capabilities { requireCapability('dev.composemc:composemc-kotlin') }
    }
}

verifyMinecraftArtifacts(artifacts, [
    'public-f net.minecraft.world.inventory.Slot f_40220_',
    'public-f net.minecraft.world.inventory.Slot f_40221_',
    'protected net.minecraft.client.gui.screens.inventory.AbstractContainerScreen m_280092_(Lnet/minecraft/client/gui/GuiGraphics;Lnet/minecraft/world/inventory/Slot;)V',
] as Set, [] as Set)
verifyMinecraftRuns(runSettings, 'earlyWindowControl=false\n')
