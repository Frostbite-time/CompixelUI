name: mod-publish
# One approval owns the secrets and publication. A separate build-only workflow uses one runner per adapter.
# Successful CurseForge uploads have per-file receipts; retries recheck receipts and GitHub assets.
on: workflow_dispatch

concurrency:
  group: mod-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish player archives
    environment: mod-publish
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      # Dispatch, observe and download this release's build-only workflow.
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read the target registry, the changelog and the release tag
        id: release
        env:
          CURSEFORGE_ID: ${{ secrets.CURSEFORGE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/mod_release.mjs prepare
      - name: Build the required adapters on separate runners
        id: builds
        if: steps.release.outputs.build == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILDS: ${{ steps.release.outputs.builds }}
        run: node tools/mod_builds.mjs dispatch
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.build == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.builds.outputs.run_id }}
          pattern: '*forge-*'
          path: dist
      - name: Verify and gather the downloaded adapter archives
        if: steps.release.outputs.build == 'true'
        env:
          BUILDS: ${{ steps.release.outputs.builds }}
        run: node tools/mod_publish.mjs gather
      - name: Check out the pinned publisher
        if: steps.release.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: Kir-Antipov/mc-publish
          ref: 52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
          path: .work/mc-publish
          persist-credentials: false
      - name: Publish both destinations in parallel
        if: steps.release.outputs.build == 'true'
        env:
          CURSEFORGE_ID: ${{ secrets.CURSEFORGE_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOADS: ${{ steps.release.outputs.uploads }}
          PUBLISH_GITHUB: ${{ steps.release.outputs.github }}
        run: node tools/mod_publish.mjs publish .work/mc-publish
