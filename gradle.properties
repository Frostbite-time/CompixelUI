org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official

core_java_version=17
org.gradle.java.installations.fromEnv=COMPIXEL_JDK17,COMPIXEL_JDK21,COMPIXEL_JDK25
mod_id=compixel
mod_name=CompixelUI
mod_license=MIT
mod_authors=Frostbite-Time
mod_url=https://github.com/Frostbite-time/CompixelUI
mod_issues_url=https://github.com/Frostbite-time/CompixelUI/issues
mod_version=0.1.10-alpha.9
# Runtime bundles are published separately. Raise a bundle's version whenever its contents change;
# runtimes/<name>/bundle.lock records the dependencies each version contains.
runtime_standard_version=1.0.0
runtime_vulkan_version=1.0.0
runtime_kotlin_version=1.0.0
loader_version_range=[1,)
