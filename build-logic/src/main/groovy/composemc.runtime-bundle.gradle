import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import groovy.xml.XmlSlurper
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.maven.MavenModule
import org.gradle.maven.MavenPomArtifact

plugins { id 'java-library' }
pluginManager.apply('com.gradleup.shadow')

def skikoPlatforms = ['windows-x64', 'windows-arm64', 'linux-x64', 'linux-arm64', 'macos-x64', 'macos-arm64']
def skikoVersion = project.skiko_version.toString()
def profile = project.runtime_profile.toString()
// KFF supplies these libraries. Swing integration and atomicfu remain ours.
def suppliedByKotlinProvider = { id ->
    id.group == 'org.jetbrains.kotlin' || (id.group == 'org.jetbrains.kotlinx' &&
        (id.name.startsWith('kotlinx-serialization-') ||
            id.name in ['kotlinx-coroutines-core', 'kotlinx-coroutines-core-jvm', 'kotlinx-coroutines-jdk8']))
}
repositories {
    // PREFER_PROJECT requires the runtime module to declare the Polyfrost
    // repository itself; these artifacts include the Vulkan-capable natives.
    maven { url = 'https://repo.polyfrost.org/releases' }
    mavenCentral()
    google()
}

dependencies {
    implementation project(':host')
    implementation project(':render-gl')
    if (runtime_profile == 'vulkan') implementation project(':render-vulkan')
    implementation project(':ui-ore')
    skikoPlatforms.each { skikoPlatform ->
        runtimeOnly "org.jetbrains.skiko:skiko-awt-runtime-${skikoPlatform}:${skiko_version}"
    }
}

def registerNotices = { boolean withKotlin ->
    tasks.register(withKotlin ? 'thirdPartyNoticesWithKotlin' : 'thirdPartyNotices') {
        def output = layout.buildDirectory.dir("third-party/${withKotlin ? 'with-kotlin' : 'external-kotlin'}")
        inputs.files(configurations.runtimeClasspath)
        inputs.files(rootProject.file('LICENSE'), rootProject.file('THIRD-PARTY-NOTICES.md'))
        inputs.dir(rootProject.file('licenses/common'))
        inputs.dir(rootProject.file('licenses/runtime'))
        outputs.dir(output)
        doLast {
            def artifacts = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll {
                withKotlin || !suppliedByKotlinProvider(it.moduleVersion.id)
            }.sort {
                it.moduleVersion.id.toString()
            }
            def noticesRoot = output.get().asFile
            // Remove notices for dependencies/versions no longer in this runtime.
            project.delete(noticesRoot)
            noticesRoot.mkdirs()
            ['common', 'runtime'].each { group ->
                copy {
                    from rootProject.file("licenses/$group")
                    into new File(noticesRoot, "licenses/$group")
                }
            }
            copy {
                from rootProject.file('THIRD-PARTY-NOTICES.md')
                into noticesRoot
            }
            def external = artifacts.findAll { !(it.id.componentIdentifier instanceof ProjectComponentIdentifier) }
            def pomResult = dependencies.createArtifactResolutionQuery()
                .forComponents(external.collect { it.id.componentIdentifier }.unique())
                .withArtifacts(MavenModule, MavenPomArtifact).execute()
            if (pomResult.components.any { it instanceof org.gradle.api.artifacts.result.UnresolvedComponentResult })
                throw new GradleException('Cannot resolve third-party license metadata')
            def poms = [:]
            pomResult.resolvedComponents.each { component ->
                def resolved = component.getArtifacts(MavenPomArtifact).find { it instanceof org.gradle.api.artifacts.result.ResolvedArtifactResult }
                if (resolved == null) throw new GradleException("Missing license POM for ${component.id}")
                poms[component.id] = resolved.file
            }
            def licenseIndex = []
            new File(noticesRoot, 'dependencies.txt').setText(
                artifacts.collect { it.moduleVersion.id.toString() }.unique().join('\n') + '\n', 'UTF-8')
            artifacts.each { artifact ->
                def id = artifact.moduleVersion.id
                def prefix = "${id.group}/${id.name}/${id.version}"
                def ownCode = artifact.id.componentIdentifier instanceof ProjectComponentIdentifier
                def licenseNames = ['MIT License']
                def licenseUrls = ['https://opensource.org/license/mit']
                if (!ownCode) {
                    def pomFile = poms[artifact.id.componentIdentifier]
                    def pom = new XmlSlurper(false, false).parse(pomFile)
                    licenseNames = pom.licenses.license.collect { it.name.text() }
                    licenseUrls = pom.licenses.license.collect { it.url.text() }
                    // All current JVM dependencies declare Apache-2.0. A new license
                    // needs its own reviewed text instead of inheriting this fallback.
                    if (licenseNames.empty || !licenseNames.every { it.toLowerCase(Locale.ROOT).contains('apache') && it.contains('2.0') })
                        throw new GradleException("Review license declaration for $id: $licenseNames")
                    copy { from pomFile; into new File(noticesRoot, prefix); rename { 'pom.xml' } }
                }
                def entry = [coordinate: id.toString(), declaredLicense: ownCode ? 'MIT' : 'Apache-2.0',
                    declaredNames: licenseNames, licenseUrls: licenseUrls, directory: prefix]
                if (id.group == 'org.jetbrains.skiko')
                    entry.supplementalNotices = ['licenses/runtime/skiko/NOTICE.txt', 'licenses/runtime/skia/']
                if (ownCode && id.name == 'ui-ore')
                    entry.supplementalNotices = ['dev/composemc/ui/ore/Monocraft-LICENSE.txt']
                licenseIndex.add(entry)
                copy {
                    from ownCode ? rootProject.file('LICENSE') : rootProject.file('licenses/common/Apache-2.0.txt')
                    into new File(noticesRoot, prefix)
                    rename { 'LICENSE.txt' }
                }
                copy {
                    from zipTree(artifact.file)
                    include { details ->
                        def name = details.name.toLowerCase(Locale.ROOT)
                        name.contains('license') || name.contains('notice') || name.startsWith('copying')
                    }
                    into new File(noticesRoot, prefix)
                    includeEmptyDirs = false
                }
            }
            new File(noticesRoot, 'dependencies.json').setText(JsonOutput.prettyPrint(JsonOutput.toJson(licenseIndex)) + '\n', 'UTF-8')
        }
    }
}

def fullRuntime = tasks.register('withKotlinJar', ShadowJar) {
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
}
def noticesByVariant = [registerNotices(false), registerNotices(true)]
[tasks.named('shadowJar'), fullRuntime].eachWithIndex { archive, index ->
    archive.configure {
        def withKotlin = index == 1
        archiveBaseName = "composemc-runtime-${runtime_profile}"
        archiveClassifier = withKotlin ? 'with-kotlin' : 'universal'
        from(noticesByVariant[index]) { into 'META-INF/composemc-third-party' }
        if (!withKotlin) dependencies {
            exclude { dependency -> suppliedByKotlinProvider(dependency.module.id) }
        }
        // Compose splits packages across artifacts; NeoForge 1.21.1 needs one module for them.
        // Do not relocate or minimize: compiler ABI, service providers and JNI require their names.
        mergeServiceFiles()
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        filesMatching('META-INF/services/**') { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
        exclude 'module-info.class', 'META-INF/versions/**/module-info.class'
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
        manifest {
            attributes 'FMLModType': 'LIBRARY', 'Automatic-Module-Name': 'dev.composemc.runtime'
        }
    }
}

[false, true].each { withKotlin ->
    configurations.create(withKotlin ? 'bundledRuntimeWithKotlin' : 'bundledRuntime') {
        canBeConsumed = true
        canBeResolved = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.SHADOWED))
        }
        outgoing.capability("${project.group}:composemc-runtime-${profile}${withKotlin ? '-with-kotlin' : ''}:${project.version}")
    }
    artifacts.add(withKotlin ? 'bundledRuntimeWithKotlin' : 'bundledRuntime', withKotlin ? fullRuntime : tasks.named('shadowJar'))
}

tasks.register('verifyRuntimeArchive') {
    dependsOn tasks.named('shadowJar'), fullRuntime
    doLast {
        def versions = configurations.runtimeClasspath.incoming.resolutionResult.allComponents
            .findAll { it.moduleVersion?.group == 'org.jetbrains.skiko' }
            .collect { it.moduleVersion.version }.toSet()
        if (versions != [skikoVersion].toSet()) throw new GradleException("Mixed Skiko ABI/native versions: $versions; expected $skikoVersion")
        [tasks.named('shadowJar'), fullRuntime].eachWithIndex { archive, index ->
            def withKotlin = index == 1
            def file = archive.get().archiveFile.get().asFile
            new java.util.zip.ZipFile(file).withCloseable { zip ->
                def required = [
                    'dev/composemc/host/UiSession.class',
                    'dev/composemc/render/FrameRenderer.class',
                    'dev/composemc/render/gl/OpenGlFrameRenderer.class',
                    'androidx/compose/runtime/SnapshotStateKt.class',
                    'META-INF/services/kotlinx.coroutines.internal.MainDispatcherFactory',
                    'META-INF/composemc-third-party/dependencies.txt',
                    'META-INF/composemc-third-party/dependencies.json',
                    'META-INF/composemc/LICENSE',
                    'META-INF/composemc-third-party/THIRD-PARTY-NOTICES.md',
                    'META-INF/composemc-third-party/licenses/common/Apache-2.0.txt',
                    'META-INF/composemc-third-party/licenses/runtime/skiko/NOTICE.txt',
                    'META-INF/composemc-third-party/licenses/runtime/skia/LICENSE.txt',
                    'dev/composemc/ui/ore/Monocraft-LICENSE.txt',
                ]
                if (withKotlin) required.addAll(['kotlin/jvm/internal/Intrinsics.class',
                    'kotlinx/coroutines/Job.class', 'kotlinx/serialization/KSerializer.class'])
                else if (zip.entries().toList().any {
                    !it.directory && (it.name.startsWith('kotlin/') || it.name.startsWith('kotlinx/serialization/') ||
                        (it.name.startsWith('kotlinx/coroutines/') && !it.name.startsWith('kotlinx/coroutines/swing/')))
                }) throw new GradleException('External-Kotlin runtime embedded provider classes')
                def hasVulkan = zip.getEntry('dev/composemc/render/vulkan/VulkanFrameRenderer.class') != null
                if (hasVulkan != (profile == 'vulkan')) throw new GradleException("Incorrect backend contents for runtime $profile")
                required.each { if (zip.getEntry(it) == null) throw new GradleException("Missing runtime entry: $it") }
                if (zip.entries().any { it.name.startsWith('META-INF/composemc-third-party/licenses/javadoc/') })
                    throw new GradleException('Documentation licenses leaked into runtime')
                def licenseIndex = new JsonSlurper().parseText(zip.getInputStream(zip.getEntry('META-INF/composemc-third-party/dependencies.json')).getText('UTF-8'))
                licenseIndex.each { entry ->
                    if (zip.getEntry("META-INF/composemc-third-party/${entry.directory}/LICENSE.txt") == null)
                        throw new GradleException("Missing license for ${entry.coordinate}")
                }
                if (zip.entries().toList().any { it.name.startsWith('org/lwjgl/') }) {
                    throw new GradleException('The runtime must use Minecraft LWJGL, not bundle another copy')
                }
                if (zip.entries().toList().any {
                    it.name.toLowerCase(Locale.ROOT).contains('mixin') ||
                        it.name.startsWith('dev/composemc/demo/') || it.name.startsWith('dev/composemc/development/') ||
                        it.name.startsWith('dev/composemc/render/gl/testing/') ||
                        it.name.startsWith('dev/composemc/render/vulkan/testing/') || it.name.startsWith('dev/composemc/testing/') ||
                        it.name.contains('OpenGlRendererProbe') || it.name.contains('OpenGlProbeResult') ||
                        it.name.startsWith('androidx/compose/material3/')
                }) {
                    throw new GradleException('Test tooling or injection files leaked into the shared runtime')
                }
                if (zip.entries().toList().count { it.name.endsWith('.sha256') && it.name.contains('skiko') } < skikoPlatforms.size()) {
                    throw new GradleException("Missing Skiko native library checksum for ${skikoPlatforms}")
                }
                skikoPlatforms.each { skikoPlatform ->
                    if (zip.getEntry("skiko-${skikoPlatform}.dll") == null
                        && zip.getEntry("libskiko-${skikoPlatform}.so") == null
                        && zip.getEntry("libskiko-${skikoPlatform}.dylib") == null) {
                        throw new GradleException("Missing Skiko native library for ${skikoPlatform}")
                    }
                }
            }
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyRuntimeArchive') }
