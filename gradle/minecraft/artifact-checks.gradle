// Shared archive invariants. Each adapter declares its expected transformer and injection files.
ext.verifyMinecraftArtifacts = { Map artifacts, Set<String> expectedTransforms, Set<String> expectedMixins ->
    def verifyLicenseGroups = { zip, String prefix, List<String> expected ->
        def licenseRoot = rootProject.file('licenses')
        licenseRoot.listFiles().findAll { it.directory }.each { group ->
            if (group.name in expected) {
                project.fileTree(group).files.each { file ->
                    def relative = licenseRoot.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                    if (zip.getEntry("$prefix/$relative") == null)
                        throw new GradleException("Missing license group content: $relative")
                }
            } else if (zip.entries().any { it.name.startsWith("$prefix/${group.name}/") }) {
                throw new GradleException("Unrelated license group included: ${group.name}")
            }
        }
    }
    def releaseCheck = tasks.register('verifyReleaseIsolation') {
        group = 'verification'
        // The Maven JAR first: both player JARs must equal it apart from their embedded bundles.
        def archives = [artifacts.release, artifacts.player.release, artifacts.playerWithKotlin.release]
        dependsOn archives, "${artifacts.runtime.path}:verifyRuntimeArchive", "${artifacts.kotlinRuntime.path}:verifyRuntimeArchive"
        archives.each { archive -> inputs.file archive.flatMap { it.archiveFile } }
        doLast {
            def profile = artifacts.runtime.runtime_profile
            def runtimeBundle = [artifact: "compixel-runtime-$profile".toString(), version: artifacts.runtime.version.toString()]
            def kotlinBundle = [artifact: 'compixel-kotlin', version: artifacts.kotlinRuntime.version.toString()]
            def mavenEntries = null
            archives.eachWithIndex { archive, index ->
                def file = archive.get().archiveFile.get().asFile
                new java.util.zip.ZipFile(file).withCloseable { zip ->
                    def entries = zip.entries().toList().findAll { !it.directory }*.name
                    def own = entries.findAll { !it.startsWith('META-INF/jarjar/') && it != 'META-INF/MANIFEST.MF' }.toSet()
                    def expectedBundles = [[], [runtimeBundle], [runtimeBundle, kotlinBundle]][index]
                    if (expectedBundles.empty) {
                        if (entries.any { it.startsWith('META-INF/jarjar/') })
                            throw new GradleException("The Maven JAR ${file.name} embeds runtime bundles")
                        mavenEntries = own
                    } else {
                        def jars = new groovy.json.JsonSlurper().parseText(zip.getInputStream(zip.getEntry('META-INF/jarjar/metadata.json')).getText('UTF-8')).jars
                        def embedded = jars.collect { [artifact: it.identifier.artifact, version: it.version.artifactVersion] }
                        if (embedded.toSet() != expectedBundles.toSet() || jars.any { it.identifier.group != 'dev.compixel' || zip.getEntry(it.path) == null })
                            throw new GradleException("Incorrect embedded bundles in ${file.name}: $embedded, expected $expectedBundles")
                        if (own != mavenEntries)
                            throw new GradleException("${file.name} differs from the Maven JAR outside META-INF/jarjar: ${(own - mavenEntries) + (mavenEntries - own)}")
                    }
                    verifyLicenseGroups(zip, 'META-INF/compixel-third-party/licenses', ['common', 'runtime'])
                    ['META-INF/compixel/runtime.properties', 'dev/compixel/platform/ComposeRuntime.class', 'dev/compixel/host/UiSession.class',
                     'dev/compixel/render/gl/OpenGlFrameRenderer.class', 'dev/compixel/ui/ore/Compixel.ttf', 'dev/compixel/ui/ore/Compixel-OFL.txt'].each {
                        if (zip.getEntry(it) == null) throw new GradleException("Missing CompixelUI module entry in ${file.name}: $it")
                    }
                    if ((zip.getEntry('dev/compixel/render/vulkan/VulkanFrameRenderer.class') != null) != (profile == 'vulkan'))
                        throw new GradleException("Incorrect backend contents for the $profile profile in ${file.name}")
                    if (entries.any { it.startsWith('androidx/') || it.startsWith('org/jetbrains/skia') || it.startsWith('dev/compixel/runtime/') ||
                        it.endsWith('.dll') || it.endsWith('.so') || it.endsWith('.dylib') })
                        throw new GradleException("Runtime bundle classes leaked into the mod JAR ${file.name}")
                    if (zip.entries().any { it.name.startsWith('kotlin/') || it.name.startsWith('kotlinx/') || it.name.startsWith('thedarkcolour/') })
                        throw new GradleException('Kotlin provider classes leaked into outer mod')
                    ['META-INF/compixel/LICENSE', 'META-INF/compixel-third-party/THIRD-PARTY-NOTICES.md'].each {
                        if (zip.getEntry(it) == null) throw new GradleException("Missing release license notice: $it")
                    }
                    def actualMixins = zip.entries().findAll { !it.directory && it.name.toLowerCase(java.util.Locale.ROOT).contains('mixin') }
                        .collect { it.name }.toSet()
                    if (actualMixins != expectedMixins)
                        throw new GradleException("Unexpected Mixin contents: $actualMixins, expected $expectedMixins")
                    if (!expectedMixins.empty) {
                        def mixinConfig = new groovy.json.JsonSlurper().parseText(
                            zip.getInputStream(zip.getEntry('compixel.mixins.json')).getText('UTF-8'))
                        if (mixinConfig.package != 'dev.compixel.forge.mixin' ||
                            mixinConfig.client != ['GuiRendererMixin'] || mixinConfig.mixins || mixinConfig.server ||
                            mixinConfig.required != true || mixinConfig.injectors?.defaultRequire != 1)
                            throw new GradleException('Unexpected native GUI Mixin configuration')
                    }
                    def bad = zip.entries().findAll { entry ->
                        def name = entry.name.toLowerCase(java.util.Locale.ROOT)
                        name.startsWith('dev/compixel/development/') || name.startsWith('dev/compixel/demo/') ||
                            name.startsWith('dev/compixel/testing/') || name.startsWith('dev/compixel/render/gl/testing/') ||
                            name.startsWith('dev/compixel/render/vulkan/testing/') ||
                            ['acceptanceprobe', 'benchmarkprobe', 'tooltipprobe', 'composepreviewscreen', 'suitesession', 'suiteplatform']
                                .any { name.contains(it) }
                    }.collect { it.name }
                    if (!bad.empty) throw new GradleException("Test/injection files leaked into release JAR: $bad")
                    def metadata = zip.getInputStream(zip.getEntry(artifacts.metadataPath)).getText('UTF-8')
                    if (!metadata.contains('license="MIT"')) throw new GradleException('Incorrect project license in mod metadata')
                    def registrations = (metadata =~ /(?m)^\s*\[\[mixins\]\]\s*\R\s*config\s*=\s*"([^"]+)"/)
                        .collect { it[1] }.toSet()
                    def expectedRegistrations = expectedMixins.empty ? [] as Set : ['compixel.mixins.json'] as Set
                    if (registrations != expectedRegistrations || metadata.findAll(/\[\[mixins\]\]/).size() != expectedRegistrations.size())
                        throw new GradleException("Unexpected Mixin registrations: $registrations")
                    if (expectedTransforms != null) {
                        def at = zip.getEntry('META-INF/accesstransformer.cfg')
                        if (at == null) throw new GradleException('Missing access transformer')
                        def actual = zip.getInputStream(at).getText('UTF-8').readLines()
                            .collect { it.trim() }.findAll { it && !it.startsWith('#') }.toSet()
                        if (actual != expectedTransforms) throw new GradleException('Unexpected access transformers for this adapter')
                    }
                }
            }
            logger.lifecycle('Release isolation PASS: Maven and player JARs match; no development tools, demos or unexpected mixins')
        }
    }
    def developmentCheck = tasks.register('verifyDevelopmentArchive') {
        dependsOn artifacts.development
        doLast {
            new java.util.zip.ZipFile(artifacts.development.get().archiveFile.get().asFile).withCloseable { zip ->
                verifyLicenseGroups(zip, 'META-INF/compixel-third-party/licenses', ['common', 'runtime'])
                if (zip.getEntry('dev/compixel/development/CompixelDevelopment.class') == null)
                    throw new GradleException('Missing development mod entry point')
                if (zip.getEntry('dev/compixel/render/gl/testing/OpenGlRendererProbe.class') == null)
                    throw new GradleException('Missing shared OpenGL probe fixture')
                if (zip.getEntry('dev/compixel/testing/render/RendererAcceptance.class') == null)
                    throw new GradleException('Missing common renderer acceptance scenarios')
                def hasVulkanProbe = zip.getEntry('dev/compixel/render/vulkan/testing/VulkanRendererProbe.class') != null
                if (hasVulkanProbe != (artifacts.runtime.runtime_profile == 'vulkan'))
                    throw new GradleException('Incorrect Vulkan probe contents for this adapter')
                if (zip.getEntry('dev/compixel/render/gl/GlStateSnapshot.class') != null)
                    throw new GradleException('Development artifact embedded renderer implementation')
                if (zip.entries().findAll { it.name.startsWith('androidx/') || it.name.startsWith('kotlin/') ||
                    it.name.startsWith('org/jetbrains/skiko/') || it.name.startsWith('org/jetbrains/skia/') ||
                    it.name.startsWith('dev/compixel/forge/') })
                    throw new GradleException('Development artifact embedded runtime/production adapter classes')
            }
        }
    }
    def apiArchiveCheck = tasks.register('verifyApiArchives') {
        group = 'verification'
        description = 'Verify source coverage, public API pages, variant isolation and publishable documentation.'
        dependsOn artifacts.apiDocs.sources, artifacts.apiDocs.documentation
        doLast {
            def api = artifacts.apiDocs
            new java.util.zip.ZipFile(api.sources.get().archiveFile.get().asFile).withCloseable { zip ->
                ['dev/compixel/host/UiBinding.kt', 'dev/compixel/ui/ore/button/OreButton.kt',
                 'dev/compixel/sync/state/SyncSchema.java', 'dev/compixel/slots/SlotBehavior.java',
                 'dev/compixel/forge/ComposeScreen.kt', 'META-INF/compixel/LICENSE'].each {
                    if (zip.getEntry(it) == null) throw new GradleException("Missing library source: $it")
                }
                def checkout = [:]
                api.sourceRoots.each { root ->
                    project.fileTree(root).matching { include '**/*.java', '**/*.kt' }.files.each { source ->
                        checkout[root.toPath().relativize(source.toPath()).toString().replace('\\', '/')] = source
                    }
                }
                // Every adapter shares the dev.compixel.forge package, so adapter sources must come from this checkout's roots.
                def forbidden = zip.entries().findAll {
                    it.name.startsWith('dev/compixel/development/') || it.name.startsWith('dev/compixel/demo/') ||
                        it.name.startsWith('dev/compixel/testing/') ||
                        it.name.startsWith('net/minecraft/') || it.name.startsWith('androidx/') || it.name.startsWith('kotlin/') ||
                        it.name.startsWith('dev/compixel/forge/') && !it.directory && !checkout.containsKey(it.name) ||
                        it.name.endsWith('.class') || it.name.endsWith('Test.kt') || it.name.endsWith('Test.java')
                }
                if (!forbidden.empty) throw new GradleException("Unexpected sources in published API: ${forbidden*.name}")
                // Compare bytes with this checkout, catching stale or wrong-version adapter sources.
                checkout.each { relative, source ->
                    def entry = zip.getEntry(relative)
                    if (entry == null || !Arrays.equals(zip.getInputStream(entry).bytes, source.bytes))
                        throw new GradleException("Source archive differs from checkout: $relative")
                }
            }
            new java.util.zip.ZipFile(api.documentation.get().archiveFile.get().asFile).withCloseable { zip ->
                verifyLicenseGroups(zip, 'third-party', ['common', 'javadoc'])
                ['index.html', 'scripts/pages.json', 'META-INF/compixel/LICENSE',
                 "${api.moduleName}/dev.compixel.host/-ui-binding/index.html",
                 "${api.moduleName}/dev.compixel.sync.state/-sync-schema/index.html",
                 "${api.moduleName}/dev.compixel.forge/-compose-screen/index.html",
                 "${api.moduleName}/dev.compixel.ui.ore.button/-ore-button.html"].each {
                    if (zip.getEntry(it.toString()) == null) throw new GradleException("Missing generated API page: $it")
                }
                def index = zip.getInputStream(zip.getEntry('index.html')).getText('UTF-8')
                if (!index.contains('API reference') || !index.contains('本参考'))
                    throw new GradleException('Missing bilingual API overview')
                zip.entries().findAll { it.name.endsWith('.html') || it.name.endsWith('.json') }.each { entry ->
                    def text = zip.getInputStream(entry).getText('UTF-8')
                    if (text.contains(rootProject.rootDir.absolutePath) || text.contains(rootProject.rootDir.toURI().toString()) ||
                        text.contains('file:///') || text.contains('dev.compixel.development'))
                        throw new GradleException("Private build paths or development APIs leaked into ${entry.name}")
                }
            }
        }
    }
    tasks.named('check') { dependsOn releaseCheck, developmentCheck, apiArchiveCheck }
}
