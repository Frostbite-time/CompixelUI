import net.neoforged.moddevgradle.tasks.JarJar

plugins {
    id 'composemc.jvm-library'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'net.neoforged.moddev'
}

// This adapter owns its loader/toolchain, runtime, local sources and native run options.
kotlin.jvmToolchain(java_version as int)
ext.skiko_version = libs.versions.skiko.vulkan.get()
apply plugin: 'composemc.skiko-profile'
def runtimeBundle = project(':runtime-vulkan')

repositories {
    maven { url = 'https://repo.polyfrost.org/releases' }
    mavenCentral()
    google()
}
// Minecraft supplies epoll only on Linux; keep the lock portable across hosts.
dependencyLocking.ignoredDependencies.add('io.netty:netty-transport-native-epoll')

apply from: rootProject.file('gradle/minecraft/sources.gradle')
apply from: rootProject.file('gradle/minecraft/artifacts.gradle')
apply from: rootProject.file('gradle/minecraft/artifact-checks.gradle')
apply from: rootProject.file('gradle/minecraft/runs.gradle')

def rendererFixtures = configureMinecraftSources([':render-gl', ':render-vulkan'])
def artifacts = configureMinecraftArtifacts(
    withKotlinDependencies: JarJar.registerWithConfiguration(project, 'withKotlinJarJar'),
    loader: 'neoforge', runtime: runtimeBundle, rendererFixtures: rendererFixtures,
    metadataPath: 'META-INF/neoforge.mods.toml',
    metadataValues: [neo_version: neo_version],
    release: tasks.named('jar'))

def requestedBackend = providers.gradleProperty('composemcBackend').orElse('auto').get()
if (!(requestedBackend in ['auto', 'cpu'] + minecraft_backends.split(',').toList()))
    throw new GradleException('Unsupported backend for neoforge 26.3: ' + requestedBackend)
def backend = requestedBackend
def runSettings = minecraftRunSettings(backend)
def vulkanValidation = providers.gradleProperty('composemcVulkanValidation').orElse('false').get() == 'true'
def suiteRun = { run, String suite ->
    run.client()
    configureSuiteRun(run, runSettings, suite)
    run.programArguments.addAll '--graphicsBackend', backend == 'vulkan' ? 'vulkan' : 'opengl'
    if (vulkanValidation) run.programArguments.add '--vulkanValidation'
}

neoForge {
    version = neo_version
    addModdingDependenciesTo sourceSets.packagedRun
    addModdingDependenciesTo sourceSets.test
    addModdingDependenciesTo sourceSets.development
    ideSyncTask artifacts.metadata
    runs {
        configureEach { systemProperty 'composemc.backend', backend }
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        acceptance { suiteRun(delegate, 'acceptance') }
        benchmark { suiteRun(delegate, 'benchmark') }
    }
    mods {
        composemc {
            sourceSet sourceSets.main
            sourceSet project(':menu-sync').sourceSets.main
            sourceSet project(':slot-core').sourceSets.main
        }
        composemc_development {
            sourceSet sourceSets.development
            sourceSet project(':demo').sourceSets.main
            rendererFixtures.each { sourceSet it }
        }
    }
}

dependencies {
    compileOnly project(':host')
    compileOnly project(':ui-ore')
    compileOnly project(':render-gl')
    compileOnly project(':render-vulkan')
    compileOnly project(':menu-sync')
    compileOnly project(':slot-core')
    compileOnly("org.jetbrains.compose.foundation:foundation:" + libs.versions.compose.get())
    developmentCompileOnly project(':demo')
    developmentCompileOnly project(':testing')
    developmentCompileOnly(testFixtures(project(':render-gl')))
    developmentCompileOnly(testFixtures(project(':render-vulkan')))
    testImplementation project(':host')
    testImplementation project(':menu-sync')
    runtimeOnly(runtimeBundle) {
        capabilities { requireCapability('dev.composemc:composemc-runtime-vulkan-with-kotlin') }
    }
    jarJar(runtimeBundle) {
        capabilities { requireCapability('dev.composemc:composemc-runtime-vulkan') }
    }
}

verifyMinecraftArtifacts(artifacts, [
    'public-f net.minecraft.world.inventory.Slot x',
    'public-f net.minecraft.world.inventory.Slot y',
    'protected-f net.minecraft.client.gui.screens.inventory.AbstractContainerScreen imageWidth',
    'protected-f net.minecraft.client.gui.screens.inventory.AbstractContainerScreen imageHeight',
    'public-f com.mojang.renderpearl.frontend.FrontendGpuDevice backend',
] as Set, ['composemc.mixins.json', 'dev/composemc/neoforge/mixin/GuiRendererMixin.class'] as Set)
verifyMinecraftRuns(runSettings, 'earlyWindowControl=false\n', vulkanValidation, [] as Set)
