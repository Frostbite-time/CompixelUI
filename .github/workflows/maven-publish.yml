name: maven-publish
# Started by hand. Jobs that publish use the maven-publish environment, whose required reviewers approve
# them and whose secrets REPOSILITE_TOKEN_NAME and REPOSILITE_TOKEN_SECRET hold a Reposilite access token
# with write access to /releases. New runtime bundle versions are approved first, then all adapters at once.
on: workflow_dispatch

concurrency:
  group: maven-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  MAVEN_RELEASES: https://maven.wintercogs.com/releases

jobs:
  preflight:
    name: Check the repository
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      bundles: ${{ steps.bundles.outputs.bundles }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to replace a published library version
        run: |
          # Fail before anyone is asked to approve a release that cannot succeed.
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          targets=$(sed -n 's/^targets=//p' gradle/minecraft-targets.properties | tr -d '\r' | tr ',' ' ')
          for target in $targets; do
            directory=$(awk -F= -v key="$target.project" '$1 == key { print $2 }' gradle/minecraft-targets.properties | tr -d '\r')
            for artifact in "composemc-${directory#minecraft/}" "composemc-${directory#minecraft/}-with-kotlin"; do
              status=$(curl -s -o /dev/null -w '%{http_code}' "$MAVEN_RELEASES/dev/composemc/$artifact/$version/$artifact-$version.pom")
              if [ "$status" != 404 ]; then
                echo "::error::$artifact $version is already published or cannot be checked (HTTP $status). Raise mod_version."
                exit 1
              fi
            done
          done
      - name: Find the runtime bundle versions the repository lacks
        id: bundles
        run: node tools/check_runtime_publication.mjs

  runtimes:
    name: Runtime bundles
    needs: preflight
    if: needs.preflight.outputs.bundles != ''
    environment: maven-publish
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java17
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and publish bundles still missing
        env:
          COMPOSEMC_JDK17: ${{ steps.java17.outputs.path }}
          ORG_GRADLE_PROJECT_wintercogsUsername: ${{ secrets.REPOSILITE_TOKEN_NAME }}
          ORG_GRADLE_PROJECT_wintercogsPassword: ${{ secrets.REPOSILITE_TOKEN_SECRET }}
        run: |
          for bundle in ${{ needs.preflight.outputs.bundles }}; do
            # A failed-job retry reuses preflight outputs. Query the repository again for every bundle.
            missing=$(node tools/check_runtime_publication.mjs "$bundle")
            if [ -z "$missing" ]; then continue; fi
            bash gradlew -PcomposemcTargets=none --console=plain ":runtime-$bundle:check" \
              ":runtime-$bundle:sourcesJar" ":runtime-$bundle:javadocJar"
            missing=$(node tools/check_runtime_publication.mjs "$bundle")
            if [ -n "$missing" ]; then
              bash gradlew -PcomposemcTargets=none --console=plain ":runtime-$bundle:publishRuntimePublicationToWintercogsRepository"
            fi
            node tools/check_runtime_publication.mjs "$bundle" --require-complete
          done

  adapters:
    name: Minecraft ${{ matrix.target }}
    needs: [preflight, runtimes]
    # Runs after the runtime job succeeds, or when there was no new bundle to publish.
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.runtimes.result == 'success' || needs.runtimes.result == 'skipped') }}
    environment: maven-publish
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        target: ['1.20.1', '1.21.1', '26.1.2', '26.2', '26.3']
        include:
          - target: '1.20.1'
            loader: forge
    env:
      ADAPTER: ${{ matrix.loader || 'neoforge' }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to replace a published version
        # Repeated here for a rerun of a failed job, which does not repeat the preflight.
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          for artifact in "composemc-$ADAPTER" "composemc-$ADAPTER-with-kotlin"; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$MAVEN_RELEASES/dev/composemc/$artifact/$version/$artifact-$version.pom")
            if [ "$status" != 404 ]; then
              echo "::error::$artifact $version is already published or cannot be checked (HTTP $status). Raise mod_version."
              exit 1
            fi
          done
      - uses: actions/setup-java@v4
        id: java17
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        id: java21
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v4
        id: java25
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify
        env:
          COMPOSEMC_JDK17: ${{ steps.java17.outputs.path }}
          COMPOSEMC_JDK21: ${{ steps.java21.outputs.path }}
          COMPOSEMC_JDK25: ${{ steps.java25.outputs.path }}
        run: bash gradlew -PcomposemcTargets=${{ matrix.target }} :minecraft:$ADAPTER:build --console=plain
      - name: Publish
        env:
          COMPOSEMC_JDK17: ${{ steps.java17.outputs.path }}
          COMPOSEMC_JDK21: ${{ steps.java21.outputs.path }}
          COMPOSEMC_JDK25: ${{ steps.java25.outputs.path }}
          ORG_GRADLE_PROJECT_wintercogsUsername: ${{ secrets.REPOSILITE_TOKEN_NAME }}
          ORG_GRADLE_PROJECT_wintercogsPassword: ${{ secrets.REPOSILITE_TOKEN_SECRET }}
        run: >-
          bash gradlew -PcomposemcTargets=${{ matrix.target }} --console=plain
          :minecraft:$ADAPTER:publishLibraryPublicationToWintercogsRepository
          :minecraft:$ADAPTER:publishLibraryWithKotlinPublicationToWintercogsRepository
