import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import groovy.xml.XmlSlurper
import org.gradle.api.artifacts.result.ResolvedArtifactResult
import org.gradle.jvm.JvmLibrary
import org.gradle.language.base.artifact.SourcesArtifact
import org.gradle.language.java.artifact.JavadocArtifact
import org.gradle.maven.MavenModule
import org.gradle.maven.MavenPomArtifact

plugins {
    id 'java-library'
    id 'maven-publish'
}
pluginManager.apply('com.gradleup.shadow')

def skikoPlatforms = ['windows-x64', 'windows-arm64', 'linux-x64', 'linux-arm64', 'macos-x64', 'macos-arm64']
def skikoVersion = project.skiko_version.toString()
def profile = project.runtime_profile.toString()
// The Kotlin bundle carries what an external provider such as KFF supplies; the Compose runtimes carry the rest.
def kotlinBundle = profile == 'kotlin'
def bundleName = kotlinBundle ? 'compixel-kotlin' : "compixel-runtime-$profile"
def versionProperty = "runtime_${profile}_version"
def suppliedByKotlinProvider = { id ->
    id.group == 'org.jetbrains.kotlin' || (id.group == 'org.jetbrains.kotlinx' &&
        (id.name.startsWith('kotlinx-serialization-') ||
            id.name in ['kotlinx-coroutines-core', 'kotlinx-coroutines-core-jvm', 'kotlinx-coroutines-jdk8']))
}
// CompixelUI's own modules ship inside each adapter JAR, so bundles carry third-party code only.
def bundled = { id -> id.group != project.group.toString() && suppliedByKotlinProvider(id) == kotlinBundle }
def catalog = rootProject.extensions.getByType(org.gradle.api.artifacts.VersionCatalogsExtension).named('libs')
repositories {
    // PREFER_PROJECT requires the runtime module to declare the Polyfrost
    // repository itself; these artifacts include the Vulkan-capable natives.
    maven { url = 'https://repo.polyfrost.org/releases' }
    mavenCentral()
    google()
}

dependencies {
    // The shared modules define which libraries the bundles must supply.
    implementation project(':host')
    implementation project(':render-gl')
    if (profile == 'vulkan') implementation project(':render-vulkan')
    implementation project(':ui-ore')
    if (!kotlinBundle) skikoPlatforms.each { skikoPlatform ->
        runtimeOnly "org.jetbrains.skiko:skiko-awt-runtime-${skikoPlatform}:${skikoVersion}"
    }
}

// Adapters compare this class with the runtime profile and version they were built for.
if (!kotlinBundle) {
    def info = tasks.register('generateRuntimeInfo') {
        def output = layout.buildDirectory.dir('generated/runtime-info')
        def values = [profile: profile, version: project.version.toString()]
        inputs.properties values
        outputs.dir output
        doLast {
            def source = output.get().file('dev/compixel/runtime/RuntimeInfo.java').asFile
            source.parentFile.mkdirs()
            source.setText("""package dev.compixel.runtime;

/** Identifies this CompixelUI runtime bundle. */
public final class RuntimeInfo {
    public static final String PROFILE = "${values.profile}";
    public static final String VERSION = "${values.version}";

    private RuntimeInfo() {}
}
""", 'UTF-8')
        }
    }
    sourceSets.main.java.srcDir(info)
}

def noticesDirectory = layout.buildDirectory.dir('third-party')
def licenseGroups = kotlinBundle ? ['common'] : ['common', 'runtime']
def notices = tasks.register('thirdPartyNotices') {
    inputs.files(configurations.runtimeClasspath)
    inputs.file(rootProject.file('THIRD-PARTY-NOTICES.md'))
    licenseGroups.each { inputs.dir(rootProject.file("licenses/$it")) }
    outputs.dir(noticesDirectory)
    doLast {
        def artifacts = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll {
            bundled(it.moduleVersion.id)
        }.sort {
            it.moduleVersion.id.toString()
        }
        def noticesRoot = noticesDirectory.get().asFile
        // Remove notices for dependencies/versions no longer in this bundle.
        project.delete(noticesRoot)
        noticesRoot.mkdirs()
        licenseGroups.each { group ->
            copy {
                from rootProject.file("licenses/$group")
                into new File(noticesRoot, "licenses/$group")
            }
        }
        copy {
            from rootProject.file('THIRD-PARTY-NOTICES.md')
            into noticesRoot
        }
        def pomResult = dependencies.createArtifactResolutionQuery()
            .forComponents(artifacts.collect { it.id.componentIdentifier }.unique())
            .withArtifacts(MavenModule, MavenPomArtifact).execute()
        if (pomResult.components.any { it instanceof org.gradle.api.artifacts.result.UnresolvedComponentResult })
            throw new GradleException('Cannot resolve third-party license metadata')
        def poms = [:]
        pomResult.resolvedComponents.each { component ->
            def resolved = component.getArtifacts(MavenPomArtifact).find { it instanceof org.gradle.api.artifacts.result.ResolvedArtifactResult }
            if (resolved == null) throw new GradleException("Missing license POM for ${component.id}")
            poms[component.id] = resolved.file
        }
        def licenseIndex = []
        new File(noticesRoot, 'dependencies.txt').setText(
            artifacts.collect { it.moduleVersion.id.toString() }.unique().join('\n') + '\n', 'UTF-8')
        artifacts.each { artifact ->
            def id = artifact.moduleVersion.id
            def prefix = "${id.group}/${id.name}/${id.version}"
            def pomFile = poms[artifact.id.componentIdentifier]
            def pom = new XmlSlurper(false, false).parse(pomFile)
            def licenseNames = pom.licenses.license.collect { it.name.text() }
            def licenseUrls = pom.licenses.license.collect { it.url.text() }
            // All current JVM dependencies declare Apache-2.0. A new license
            // needs its own reviewed text instead of inheriting this fallback.
            if (licenseNames.empty || !licenseNames.every { it.toLowerCase(Locale.ROOT).contains('apache') && it.contains('2.0') })
                throw new GradleException("Review license declaration for $id: $licenseNames")
            copy { from pomFile; into new File(noticesRoot, prefix); rename { 'pom.xml' } }
            def entry = [coordinate: id.toString(), declaredLicense: 'Apache-2.0',
                declaredNames: licenseNames, licenseUrls: licenseUrls, directory: prefix]
            if (id.group == 'org.jetbrains.skiko')
                entry.supplementalNotices = ['licenses/runtime/skiko/NOTICE.txt', 'licenses/runtime/skia/']
            licenseIndex.add(entry)
            copy {
                from rootProject.file('licenses/common/Apache-2.0.txt')
                into new File(noticesRoot, prefix)
                rename { 'LICENSE.txt' }
            }
            copy {
                from zipTree(artifact.file)
                include { details ->
                    def name = details.name.toLowerCase(Locale.ROOT)
                    name.contains('license') || name.contains('notice') || name.startsWith('copying')
                }
                into new File(noticesRoot, prefix)
                includeEmptyDirs = false
            }
        }
        new File(noticesRoot, 'dependencies.json').setText(JsonOutput.prettyPrint(JsonOutput.toJson(licenseIndex)) + '\n', 'UTF-8')
    }
}

def bundle = tasks.named('shadowJar', ShadowJar) {
    archiveBaseName = bundleName
    archiveClassifier = ''
    from(notices) { into 'META-INF/compixel-third-party' }
    dependencies {
        exclude { dependency -> !bundled(dependency.module.id) }
    }
    // Compose splits packages across artifacts; NeoForge 1.21.1 needs one module for them.
    // Do not relocate or minimize: compiler ABI, service providers and JNI require their names.
    mergeServiceFiles()
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('META-INF/services/**') { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
    exclude 'module-info.class', 'META-INF/versions/**/module-info.class'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    // The Kotlin libraries version only module-info.class, and Forge 1.20.1 rejects a multi-release
    // JAR without META-INF/versions.
    addMultiReleaseAttribute = !kotlinBundle
    manifest {
        attributes 'FMLModType': 'LIBRARY', 'Automatic-Module-Name': kotlinBundle ? 'dev.compixel.kotlin' : 'dev.compixel.runtime'
    }
}

configurations.create('bundledRuntime') {
    canBeConsumed = true
    canBeResolved = false
    attributes {
        attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
        attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.SHADOWED))
    }
    outgoing.capability("${project.group}:${bundleName}:${project.version}")
}
artifacts.add('bundledRuntime', bundle)

// One version always means the same dependencies: Maven Central releases are immutable.
def bundleLock = file('bundle.lock')
def lockText = { List<String> coordinates ->
    "# Dependencies of ${bundleName} ${project.version}. Raise ${versionProperty} when they change.\n" +
        "version=${project.version}\n" + coordinates.join('\n') + '\n'
}
def lockState = { File file ->
    if (!file.exists()) return null
    def lines = file.readLines('UTF-8').findAll { it && !it.startsWith('#') }
    [version: lines.find { it.startsWith('version=') }?.substring(8), coordinates: lines.findAll { !it.startsWith('version=') }]
}
def bundledCoordinates = { new File(noticesDirectory.get().asFile, 'dependencies.txt').readLines('UTF-8').findAll { it } }
tasks.register('writeBundleLock') {
    group = 'build'
    description = "Record the dependencies of ${bundleName} ${project.version} in bundle.lock."
    dependsOn notices
    doLast {
        def coordinates = bundledCoordinates()
        def locked = lockState(bundleLock)
        if (locked && locked.version == project.version.toString() && locked.coordinates != coordinates)
            throw new GradleException("The dependencies of ${bundleName} changed; raise ${versionProperty} before recording them")
        bundleLock.setText(lockText(coordinates), 'UTF-8')
    }
}

tasks.register('verifyRuntimeArchive') {
    dependsOn bundle, notices
    if (!kotlinBundle) dependsOn ':runtime-kotlin:thirdPartyNotices'
    def kotlinCoordinatesFile = kotlinBundle ? null :
        project(':runtime-kotlin').layout.buildDirectory.file('third-party/dependencies.txt')
    doLast {
        def coordinates = bundledCoordinates()
        def locked = lockState(bundleLock)
        if (!locked || locked.version != project.version.toString() || locked.coordinates != coordinates) {
            def hint = locked && locked.version == project.version.toString() ?
                "raise ${versionProperty} in gradle.properties, then run :${project.name}:writeBundleLock" :
                "run :${project.name}:writeBundleLock"
            throw new GradleException("${bundleLock} does not describe ${bundleName} ${project.version}; $hint")
        }
        def resolvedArtifacts = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
        if (!kotlinBundle) {
            def versions = configurations.runtimeClasspath.incoming.resolutionResult.allComponents
                .findAll { it.moduleVersion?.group == 'org.jetbrains.skiko' }
                .collect { it.moduleVersion.version }.toSet()
            if (versions != [skikoVersion].toSet()) throw new GradleException("Mixed Skiko ABI/native versions: $versions; expected $skikoVersion")
            // A with-kotlin installation pairs this runtime with the shared Kotlin bundle.
            def expected = resolvedArtifacts.findAll { suppliedByKotlinProvider(it.moduleVersion.id) }
                .collect { it.moduleVersion.id.toString() }.toSet()
            def supplied = kotlinCoordinatesFile.get().asFile.readLines('UTF-8').findAll { it }.toSet()
            if (expected != supplied)
                throw new GradleException("compixel-kotlin supplies $supplied, but ${bundleName} expects $expected")
        }
        def file = bundle.get().archiveFile.get().asFile
        new java.util.zip.ZipFile(file).withCloseable { zip ->
            def entries = zip.entries().toList().findAll { !it.directory }*.name
            def required = [
                'META-INF/compixel/LICENSE',
                'META-INF/compixel-third-party/dependencies.txt',
                'META-INF/compixel-third-party/dependencies.json',
                'META-INF/compixel-third-party/THIRD-PARTY-NOTICES.md',
                'META-INF/compixel-third-party/licenses/common/Apache-2.0.txt',
            ]
            def forbidden
            if (kotlinBundle) {
                required.addAll(['kotlin/jvm/internal/Intrinsics.class', 'kotlinx/coroutines/Job.class',
                    'kotlinx/serialization/KSerializer.class'])
                forbidden = entries.findAll {
                    it.startsWith('androidx/') || it.startsWith('org/') || it.startsWith('dev/compixel/') ||
                        it.startsWith('kotlinx/atomicfu/') || it.startsWith('kotlinx/coroutines/swing/') ||
                        it.startsWith('META-INF/compixel-third-party/licenses/runtime/') ||
                        it.endsWith('.dll') || it.endsWith('.so') || it.endsWith('.dylib')
                }
            } else {
                required.addAll(['dev/compixel/runtime/RuntimeInfo.class', 'androidx/compose/runtime/SnapshotStateKt.class',
                    'META-INF/services/kotlinx.coroutines.internal.MainDispatcherFactory',
                    'META-INF/compixel-third-party/licenses/runtime/skiko/NOTICE.txt',
                    'META-INF/compixel-third-party/licenses/runtime/skia/LICENSE.txt'])
                forbidden = entries.findAll {
                    it.startsWith('kotlin/') || it.startsWith('kotlinx/serialization/') ||
                        (it.startsWith('kotlinx/coroutines/') && !it.startsWith('kotlinx/coroutines/swing/')) ||
                        (it.startsWith('dev/compixel/') && it != 'dev/compixel/runtime/RuntimeInfo.class') ||
                        // The runtime must use Minecraft's LWJGL, not bundle another copy.
                        it.startsWith('org/lwjgl/') || it.startsWith('androidx/compose/material3/') ||
                        it.toLowerCase(Locale.ROOT).contains('mixin')
                }
                if (entries.count { it.endsWith('.sha256') && it.contains('skiko') } < skikoPlatforms.size())
                    throw new GradleException("Missing Skiko native library checksum for ${skikoPlatforms}")
                skikoPlatforms.each { skikoPlatform ->
                    if (!(["skiko-${skikoPlatform}.dll", "libskiko-${skikoPlatform}.so", "libskiko-${skikoPlatform}.dylib"]
                        .any { it.toString() in entries }))
                        throw new GradleException("Missing Skiko native library for ${skikoPlatform}")
                }
            }
            required.each { if (!(it in entries)) throw new GradleException("Missing ${bundleName} entry: $it") }
            def multiRelease = new java.util.jar.JarFile(file).withCloseable { it.manifest.mainAttributes.getValue('Multi-Release') }
            if (multiRelease == 'true' && !entries.any { it.startsWith('META-INF/versions/') })
                throw new GradleException("${bundleName} declares Multi-Release without META-INF/versions, which Forge 1.20.1 rejects")
            if (!forbidden.empty) throw new GradleException("Unexpected ${bundleName} entries: ${forbidden.take(10)}")
            def licenseIndex = new JsonSlurper().parseText(zip.getInputStream(zip.getEntry('META-INF/compixel-third-party/dependencies.json')).getText('UTF-8'))
            licenseIndex.each { entry ->
                if (zip.getEntry("META-INF/compixel-third-party/${entry.directory}/LICENSE.txt") == null)
                    throw new GradleException("Missing license for ${entry.coordinate}")
            }
            if (entries.any { it.startsWith('META-INF/compixel-third-party/licenses/javadoc/') })
                throw new GradleException('Documentation licenses leaked into the bundle')
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyRuntimeArchive') }

// Like any Maven library, a bundle attaches the sources and API documentation of the code it contains: the
// attachments its libraries publish. Sources merge into one tree, as the classes do in the binary JAR; each
// library's documentation keeps its own directory.
def attachments = [sources: SourcesArtifact, javadoc: JavadocArtifact].collect { kind, type ->
    def upstream = tasks.register("upstream${kind.capitalize()}") {
        def output = layout.buildDirectory.dir("upstream-$kind")
        inputs.files(configurations.runtimeClasspath)
        outputs.dir(output)
        doLast {
            def components = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
                .findAll { bundled(it.moduleVersion.id) }.collect { it.id.componentIdentifier }.unique()
            def result = dependencies.createArtifactResolutionQuery().forComponents(components)
                .withArtifacts(JvmLibrary, type).execute()
            if (result.components.any { it instanceof org.gradle.api.artifacts.result.UnresolvedComponentResult })
                throw new GradleException("Cannot resolve the upstream $kind of ${bundleName}")
            def root = output.get().asFile
            project.delete(root)
            root.mkdirs()
            def included = []
            def missing = []
            result.resolvedComponents.sort { it.id.displayName }.each { component ->
                def files = component.getArtifacts(type).findAll { it instanceof ResolvedArtifactResult }*.file
                (files ? included : missing) << component.id.displayName
                files.each { file ->
                    copy {
                        from zipTree(file)
                        into kind == 'sources' ? root : new File(root, component.id.displayName.replace(':', '/'))
                        exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
                        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
                    }
                }
            }
            def title = kind == 'sources' ? 'Sources' : 'API documentation'
            def arrangement = kind == 'sources' ?
                'merged into one tree. Kotlin Multiplatform libraries keep source-set directories such as commonMain and jvmMain.' :
                'each under group/artifact/version, as its project publishes it.'
            new File(root, 'README.md').setText("""# ${title} of ${bundleName} ${project.version}

The ${title.toLowerCase(Locale.ROOT)} of the libraries in this bundle, ${arrangement}

Included:
${included.collect { "- $it" }.join('\n') ?: '- none'}

Published without ${kind == 'sources' ? 'sources' : 'documentation'}:
${missing.collect { "- $it" }.join('\n') ?: '- none'}

Licenses and notices are under META-INF/compixel-third-party.
""", 'UTF-8')
        }
    }
    tasks.register("${kind}Jar", Jar) {
        archiveBaseName = bundleName
        archiveClassifier = kind
        from upstream
        from(notices) { into 'META-INF/compixel-third-party' }
    }
}
tasks.named('assemble') { dependsOn bundle }

publishing {
    publications {
        runtime(MavenPublication) {
            artifactId = bundleName
            artifact bundle
            attachments.each { artifact it }
            pom {
                if (kotlinBundle) {
                    name = 'CompixelUI Kotlin libraries'
                    description = 'Kotlin stdlib, kotlinx.coroutines and kotlinx.serialization as one FML library for the with-kotlin installation of CompixelUI.'
                } else {
                    name = "CompixelUI ${profile} runtime"
                    description = "Compose ${catalog.findVersion('compose').get().requiredVersion} and Skiko ${skikoVersion} " +
                        'for Windows, Linux and macOS (x64 and arm64) as one FML library for CompixelUI.'
                }
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                    if (!kotlinBundle) {
                        license {
                            name = 'BSD 3-Clause License'
                            url = 'https://opensource.org/license/bsd-3-clause'
                            distribution = 'repo'
                            comments = 'Skia in the Skiko native libraries. META-INF/compixel-third-party lists every native component license.'
                        }
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/license/mit'
                            distribution = 'repo'
                            comments = 'The CompixelUI runtime identification class.'
                        }
                    }
                }
            }
        }
    }
}
