// Source-set mechanics only. Minecraft-facing sources stay inside each adapter.
ext.configureMinecraftSources = { ->
    sourceSets { packagedSmoke; development }
    // Packaged tests must obtain Kotlin from installed mods, not the launcher.
    configurations.named('packagedSmokeRuntimeClasspath') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
    }
    // The compiler and IDEA must agree about same-project internal visibility.
    kotlin.target.compilations.named('development') {
        associateWith(kotlin.target.compilations.getByName('main'))
    }
    evaluationDependsOn(':render-gl')
    project(':render-gl').sourceSets.testFixtures
}
