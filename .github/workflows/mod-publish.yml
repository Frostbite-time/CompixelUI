name: mod-publish
# One environment-protected job covers preflight, builds and both destinations with one approval.
# Each player JAR still has its own CurseForge receipt and GitHub release asset. Reruns read both
# destinations again and skip completed files; manual CurseForge uploads need a receipt first.
on: workflow_dispatch

concurrency:
  group: mod-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish player archives
    environment: mod-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the pinned mc-publish action's runtime for the per-file upload loop.
          node-version: '24'
      - name: Read the target registry, the changelog and the release tag
        id: release
        env:
          CURSEFORGE_ID: ${{ secrets.CURSEFORGE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/mod_release.mjs prepare
      - uses: actions/setup-java@v4
        if: steps.release.outputs.build == 'true'
        id: java17
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        if: steps.release.outputs.build == 'true'
        id: java21
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v4
        if: steps.release.outputs.build == 'true'
        id: java25
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.release.outputs.build == 'true'
      - name: Build, verify and stage only the required adapters
        if: steps.release.outputs.build == 'true'
        env:
          COMPIXEL_JDK17: ${{ steps.java17.outputs.path }}
          COMPIXEL_JDK21: ${{ steps.java21.outputs.path }}
          COMPIXEL_JDK25: ${{ steps.java25.outputs.path }}
          BUILDS: ${{ steps.release.outputs.builds }}
        run: node tools/mod_publish.mjs build
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.build == 'true'
        with:
          name: mod-release-${{ github.run_attempt }}
          path: dist/github/*
          if-no-files-found: error
          compression-level: 0
      - name: Check out the pinned CurseForge publisher
        id: publisher
        if: steps.release.outputs.upload_count != '0'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Kir-Antipov/mc-publish
          ref: 52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
          path: .work/mc-publish
          persist-credentials: false
      - name: Publish missing CurseForge files and record each receipt
        id: curseforge
        if: steps.release.outputs.upload_count != '0' && steps.publisher.outcome == 'success'
        # Try every file, then allow the independent GitHub release even if a CurseForge file failed.
        continue-on-error: true
        env:
          CURSEFORGE_ID: ${{ secrets.CURSEFORGE_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          UPLOADS: ${{ steps.release.outputs.uploads }}
        run: node tools/mod_publish.mjs curseforge .work/mc-publish
      - name: Verify the complete GitHub artifact set and release tag
        if: steps.release.outputs.github == 'true'
        run: |
          node tools/mod_release.mjs verify all dist/github
          node tools/mod_release.mjs tag
      - name: Skip the files the GitHub release already has
        id: assets
        if: steps.release.outputs.github == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/mod_release.mjs github-assets dist/github
      - name: Publish the player installation archives to GitHub
        if: steps.assets.outputs.files != ''
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.release.outputs.tag }}
          github-commitish: ${{ github.sha }}
          files: ${{ steps.assets.outputs.files }}
          name: CompixelUI ${{ steps.release.outputs.version }}
          version: ${{ steps.release.outputs.version }}
          version-type: ${{ steps.release.outputs.type }}
          changelog: |
            ${{ steps.release.outputs.changelog }}

            Choose the file matching your Minecraft version and loader. Install **one** variant only:
            - Standard: requires a compatible external Kotlin provider.
            - `with-kotlin`: includes Kotlin; do not combine it with KFF or another Kotlin runtime.

            [Runtime compatibility](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/en/compatibility.md)
            SHA-256 checksums are provided in `SHA256SUMS`.
          loaders: |
            forge
            neoforge
          game-versions: ${{ steps.release.outputs.game_versions }}
          game-version-filter: none
          environment: client | server
          # Rerun the job to recheck each asset instead of blindly retrying an uncertain upload.
          retry-attempts: 1
          fail-mode: fail
      - name: Report any CurseForge failures
        if: ${{ !cancelled() && (steps.publisher.outcome == 'failure' || steps.curseforge.outcome == 'failure') }}
        run: |
          echo '::error::One or more CurseForge files failed. Inspect their upload logs and receipts before rerunning.'
          exit 1
