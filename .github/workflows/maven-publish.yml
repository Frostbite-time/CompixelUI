name: maven-publish
# Started by hand. Jobs that publish use the maven-publish environment, whose required reviewers approve
# them and whose secrets REPOSILITE_TOKEN_NAME and REPOSILITE_TOKEN_SECRET hold a Reposilite access token
# with write access to /releases. New runtime bundle versions are approved first, then the adapters.
#
# Every runtime bundle and adapter publication whose version the repository already has is skipped with a
# notice; the others are still published. A version that is only partly in the repository fails its own job
# and must be removed by hand in Reposilite before a retry.
on: workflow_dispatch

concurrency:
  group: maven-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  MAVEN_RELEASES: https://maven.wintercogs.com/releases

jobs:
  preflight:
    name: Check the repository
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      bundles: ${{ steps.plan.outputs.bundles }}
      adapters: ${{ steps.plan.outputs.adapters }}
      adapter_count: ${{ steps.plan.outputs.adapter_count }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the versions the repository lacks
        id: plan
        # Runs before anyone is asked to approve, so a release with nothing left to publish needs no approval.
        run: node tools/maven_publication.mjs plan

  runtimes:
    name: Runtime bundles
    needs: preflight
    if: needs.preflight.outputs.bundles != ''
    environment: maven-publish
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java17
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and publish bundles still missing
        env:
          COMPIXEL_JDK17: ${{ steps.java17.outputs.path }}
          ORG_GRADLE_PROJECT_wintercogsUsername: ${{ secrets.REPOSILITE_TOKEN_NAME }}
          ORG_GRADLE_PROJECT_wintercogsPassword: ${{ secrets.REPOSILITE_TOKEN_SECRET }}
        run: |
          for bundle in ${{ needs.preflight.outputs.bundles }}; do
            # A failed-job retry reuses preflight outputs. Query the repository again for every bundle.
            missing=$(node tools/maven_publication.mjs runtime "$bundle")
            if [ -z "$missing" ]; then
              echo "::notice title=Already published::The $bundle runtime bundle is already in the repository; skipped it."
              continue
            fi
            bash gradlew -PcompixelTargets=none --console=plain ":runtime-$bundle:check" \
              ":runtime-$bundle:sourcesJar" ":runtime-$bundle:javadocJar"
            missing=$(node tools/maven_publication.mjs runtime "$bundle")
            if [ -n "$missing" ]; then
              bash gradlew -PcompixelTargets=none --console=plain ":runtime-$bundle:publishRuntimePublicationToWintercogsRepository"
            else
              echo "::notice title=Already published::The $bundle runtime bundle was published during this build; skipped it."
            fi
            node tools/maven_publication.mjs runtime "$bundle" --require-complete
          done

  adapters:
    name: Minecraft ${{ matrix.target }}
    needs: [preflight, runtimes]
    # Runs after the runtime job succeeds, or when there was no new bundle to publish.
    if: >-
      ${{ !cancelled() && needs.preflight.result == 'success' && needs.preflight.outputs.adapter_count != '0' &&
      (needs.runtimes.result == 'success' || needs.runtimes.result == 'skipped') }}
    environment: maven-publish
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      # Only the adapters with at least one publication the repository lacks.
      matrix: ${{ fromJSON(needs.preflight.outputs.adapters) }}
    env:
      ADAPTER: ${{ matrix.adapter }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the publications still missing
        id: missing
        # Repeated here for a rerun of a failed job, which reuses the preflight outputs.
        run: node tools/maven_publication.mjs adapter "$ADAPTER"
      - uses: actions/setup-java@v4
        if: steps.missing.outputs.tasks != ''
        id: java17
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        if: steps.missing.outputs.tasks != ''
        id: java21
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v4
        if: steps.missing.outputs.tasks != ''
        id: java25
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.missing.outputs.tasks != ''
      - name: Build and verify
        if: steps.missing.outputs.tasks != ''
        env:
          COMPIXEL_JDK17: ${{ steps.java17.outputs.path }}
          COMPIXEL_JDK21: ${{ steps.java21.outputs.path }}
          COMPIXEL_JDK25: ${{ steps.java25.outputs.path }}
        run: bash gradlew -PcompixelTargets=${{ matrix.target }} :minecraft:$ADAPTER:build --console=plain
      - name: Recheck immediately before publishing
        if: steps.missing.outputs.tasks != ''
        id: upload
        run: node tools/maven_publication.mjs adapter "$ADAPTER"
      - name: Publish
        if: steps.upload.outputs.tasks != ''
        env:
          COMPIXEL_JDK17: ${{ steps.java17.outputs.path }}
          COMPIXEL_JDK21: ${{ steps.java21.outputs.path }}
          COMPIXEL_JDK25: ${{ steps.java25.outputs.path }}
          ORG_GRADLE_PROJECT_wintercogsUsername: ${{ secrets.REPOSILITE_TOKEN_NAME }}
          ORG_GRADLE_PROJECT_wintercogsPassword: ${{ secrets.REPOSILITE_TOKEN_SECRET }}
          TASKS: ${{ steps.upload.outputs.tasks }}
        run: bash gradlew -PcompixelTargets=${{ matrix.target }} --console=plain $TASKS
      - name: Check that the publications are complete
        if: steps.missing.outputs.tasks != ''
        run: node tools/maven_publication.mjs adapter "$ADAPTER" --require-complete
