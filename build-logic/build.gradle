plugins { id 'groovy-gradle-plugin' }
dependencies {
    // The root build supplies the plugin at runtime; conventions need its task API.
    compileOnly "com.gradleup.shadow:shadow-gradle-plugin:${libs.versions.shadow.get()}"
    // Runtime bundles store the Skiko native libraries xz-compressed.
    implementation libs.xz
}
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.withType(JavaCompile).configureEach { options.release = 17 }
